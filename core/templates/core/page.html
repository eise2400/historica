{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock %}

{% block content %}
<h1 class="h3 mb-4">{{ page.title }}</h1>
<div class="content">
    {{ page.content|safe }}
</div>
{% if page.document %}
    <a class="btn btn-accent mt-3" href="{{ page.document.url }}" download>
        {{ page.title }} als PDF herunterladen
    </a>
{% endif %}
{% endblock %}
