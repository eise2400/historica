; PHP-Einstellungen für diese Website, ohne Zugriff auf die zentrale php.ini
; oder SSH nötig. Auf vielen PHP-FPM-Hosts (z. B. Plesk) werden .user.ini-
; Dateien automatisch übernommen (meist mit etwas Verzögerung, siehe
; user_ini.cache_ttl - üblicherweise bis zu 5 Minuten).
;
; Höhere Werte sind vor allem für den Sammelupload im Fotoarchiv-Admin
; wichtig: einzelne Scans/Fotos können mehrere MB groß sein, und die
; Miniaturbild-Erstellung braucht bei großen Fotos etwas Arbeitsspeicher.
;
; Der Sammelupload sendet Dateien in Gruppen von 15 pro Anfrage (siehe
; bulk-upload-photos.blade.php) statt einzeln - post_max_size und
; max_file_uploads müssen daher eine ganze Gruppe auf einmal fassen können,
; nicht nur eine einzelne Datei.

upload_max_filesize = 25M
post_max_size = 400M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 120
max_input_time = 300
